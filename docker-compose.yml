version: "3.8"

services:
  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://booppa:password@postgres:5432/booppa
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./:/app:delegated
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker_fast:
    build: .
    # --without-gossip/mingle/heartbeat: mandatory, and kept identical to the ECS
    # worker command so the Redis client-exhaustion failure mode is reproducible
    # locally. See the comment block in app/workers/celery_app.py.
    command: python -m celery -A app.workers.celery_app worker -B --loglevel=info -Q fast_queue --without-gossip --without-mingle --without-heartbeat
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://booppa:password@postgres:5432/booppa
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app:delegated

  worker_heavy:
    build: .
    command: python -m celery -A app.workers.celery_app worker --loglevel=info -Q heavy_queue --without-gossip --without-mingle --without-heartbeat
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://booppa:password@postgres:5432/booppa
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app:delegated

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: booppa
      POSTGRES_PASSWORD: password
      POSTGRES_DB: booppa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booppa -d booppa"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  # Headless browser service for reliable screenshots (fallback for Playwright)
  browserless:
    image: browserless/chrome:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - CONNECTION_TIMEOUT=600000
      - MAX_CONCURRENT_SESSIONS=5
    # Do not depend on browserless from app by default; app will use it only as fallback

volumes:
  postgres_data:
  redis_data:
